services:
  # ── Postgres + pgvector ───────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rkp_core
      POSTGRES_USER: rkp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Bound to loopback only: the app containers reach Postgres over the compose
      # network as `db:5432`, and the sole consumer of this published port is the
      # host-side stdio MCP server (see .env.local). Nothing off-box needs it.
      - "127.0.0.1:5433:5432"
    volumes:
      - rkp_pgdata:/var/lib/postgresql/data

  # ── REST API ──────────────────────────────────────────────────────────────
  codemanager:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8007:8007"   # REST API
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
      # Mount your local projects directory read-only so the analyzer can walk them.
      # Set PROJECTS_HOST_PATH in .env (or export it) to your projects root.
      # Both sides MUST be the same absolute path: the container path has to match
      # the `path` values stored in the DB, or analysis fails and marks projects stuck.
      - ${PROJECTS_HOST_PATH:-${HOME}/Projects}:${PROJECTS_HOST_PATH:-${HOME}/Projects}:ro
      # Second code root (web projects). Same same-path rule applies.
      - ${SITES_HOST_PATH:-${HOME}/Sites}:${SITES_HOST_PATH:-${HOME}/Sites}:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── MCP server (streamable-http) ─────────────────────────────────────────
  # Streamable-http transport avoids the SSE init-race that caused -32602 errors
  # in Claude Desktop. Endpoint: http://192.168.1.189:8008/mcp
  # This service is not started by default (use --profile mcp to enable).
  mcp:
    build: .
    command: ["python", "mcp_server.py", "--http"]
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8008:8008"   # MCP streamable-http
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - mcp

  # ── Cloudflare Tunnel (dashboard-managed) ─────────────────────────────────
  # Exposes ONLY the MCP server publicly, behind Cloudflare Access (Managed
  # OAuth) — /mcp itself has no auth, so never route it without Access.
  # REST (:8007) stays LAN-only.
  # Dashboard: Zero Trust → Networks → Tunnels → public hostname
  #   <sub>.robertrkoch.com  →  http://mcp:8008   (Host Header override EMPTY)
  # Put the tunnel's token in .env as TUNNEL_TOKEN.
  # Enable with:  docker compose --profile mcp --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:2026.11.1
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - mcp
    profiles:
      - tunnel

volumes:
  rkp_pgdata:
